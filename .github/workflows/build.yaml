name: Build Outlander APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK (Zip dans Actions)
        uses: actions/upload-artifact@v4
        with:
          name: OutlanderLauncher-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Publier APK en telechargement direct
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Outlander Launcher APK (Dernière version)"
          files: app/build/outputs/apk/debug/app-debug.apk